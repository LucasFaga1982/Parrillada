<!DOCTYPE html>
<html lang="es">

<link rel="apple-touch-icon" sizes="180x180" href="icono-parrilla.jpg">
    <link rel="icon" type="image/jpg" sizes="32x32" href="icono-parrilla.jpg">
    <link rel="icon" type="image/jpg" sizes="16x16" href="icono-parrilla.jpg">
    
    <meta name="apple-mobile-web-app-title" content="Parrilla Tracker">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#d35400">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parrilla Tracker 2.1 🔥</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --primary: #d35400; --secondary: #2c3e50; --bg: #f8f9fa; }
        body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; }
        .header-brand { background-color: var(--primary); color: white; padding: 25px; border-radius: 0 0 20px 20px; margin-bottom: 30px; }
        .card { border: none; shadow: 0 4px 10px rgba(0,0,0,0.05); border-radius: 12px; }
        .btn-fire { background-color: var(--primary); color: white; border: none; }
        .btn-fire:hover { background-color: #a04000; color: white; }
        .guest-item { transition: 0.2s; }
        .guest-item:hover { background-color: #fff8e1; }
        .cursor-pointer { cursor: pointer; }
        .guest-name:hover { text-decoration: underline; color: var(--primary); }
    </style>
</head>
<body>

<div class="container pb-5">
    
    <div class="header-brand text-center shadow">
        <h1><i class="bi bi-fire"></i> Parrilla Tracker</h1>
        <p class="mb-0 fs-5">Historial de Parrilladas y Comensales</p>
    </div>

    <div class="row">
        <div class="col-md-5 mb-4">
            
            <div class="d-flex gap-2 mb-4">
                <button onclick="iniciarNuevaParrillada()" class="btn btn-fire flex-grow-1 shadow py-3 fw-bold">
                    <i class="bi bi-plus-circle-dotted"></i> Nueva Parrillada
                </button>
                <button onclick="abrirHistorialParrilladas()" class="btn btn-dark shadow" title="Ver Historial y Borrar">
                    <i class="bi bi-clock-history"></i>
                </button>
            </div>

            <div id="form-container" class="card shadow p-3 border-warning border-2" style="display: none;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="text-secondary mb-0" id="titulo-form"><i class="bi bi-calendar-event"></i> Cargando...</h4>
                    <span class="badge bg-warning text-dark" id="modo-edicion-badge" style="display:none">Editando</span>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Fecha de la Parrillada</label>
                    <input type="date" id="fechaParrillada" class="form-control">
                </div>

                <hr>

                <div class="d-flex justify-content-between align-items-end mb-2">
                    <label class="form-label mb-0">Asistentes</label>
                    <button class="btn btn-sm btn-outline-primary" onclick="abrirModalNuevoComensal()">
                        <i class="bi bi-person-plus"></i> Nuevo
                    </button>
                </div>

                <input type="text" id="buscador" class="form-control form-control-sm mb-2" placeholder="Buscar para tildar..." onkeyup="filtrarLista()">

                <div class="list-group mb-3 overflow-auto border bg-white" style="max-height: 300px;" id="listaSeleccion">
                    </div>

                <div class="d-grid gap-2">
                    <button onclick="guardarParrillada()" class="btn btn-success fw-bold">
                        <i class="bi bi-save"></i> Guardar Cambios
                    </button>
                    <button onclick="cancelarFormulario()" class="btn btn-light text-danger">Cancelar</button>
                </div>
            </div>

        </div>

        <div class="col-md-7">
            <div class="card shadow">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-trophy-fill text-warning"></i> Top 10 Asistencias</h5>
                    <span class="badge bg-secondary" id="total-parrilladas-badge">0 Eventos</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle text-center">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Comensal</th>
                                <th>Vínculo</th>
                                <th>Asistencias</th>
                            </tr>
                        </thead>
                        <tbody id="tablaTop10">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalComensal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="tituloModalComensal">Comensal</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="idComensalEditando">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" id="inputNombre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Apellido</label>
                    <input type="text" id="inputApellido" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Vínculo</label>
                    <select id="inputVinculo" class="form-select">
                        <option value="Amigo/a">Amigo/a</option>
                        <option value="Familiar">Familiar</option>
                        <option value="Compañero/a">Compañero/a</option>
                        <option value="Vecino/a">Vecino/a</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="guardarComensal()">Guardar</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalHistorial" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-clock-history"></i> Historial</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <div class="alert alert-info small m-2 mb-0"><i class="bi bi-info-circle"></i> Toca la fecha para editar o el tacho para borrar.</div>
                <div class="list-group list-group-flush" id="listaHistorialParrilladas">
                    </div>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalDetalle" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="detalleNombre">Detalle</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="text-center mb-4">
                    <h1 class="display-4 fw-bold text-primary" id="detalleTotal">0</h1>
                    <p class="text-muted">Parrilladas Asistidas</p>
                </div>
                <h6 class="border-bottom pb-2">Fechas:</h6>
                <ul class="list-group list-group-flush" id="detalleFechas">
                    </ul>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- LÓGICA DE DATOS ---
    let datos = JSON.parse(localStorage.getItem('parrillaDataV2')) || {
        comensales: [], // { id, nombre, apellido, vinculo }
        asados: []      // { id, fecha, asistentesIds[] }
    };

    // Migración básica si venías de la versión anterior
    if(!localStorage.getItem('parrillaDataV2') && localStorage.getItem('parrillaData')){
        const oldData = JSON.parse(localStorage.getItem('parrillaData'));
        datos.comensales = oldData.comensales.map(c => ({ id: c.id, nombre: c.nombre, apellido: c.apellido, vinculo: c.vinculo }));
        datos.asados = oldData.asados;
        guardarDatos();
    }

    let idParrilladaEditando = null; // null = nueva, numero = editando existente
    const modalComensal = new bootstrap.Modal(document.getElementById('modalComensal'));
    const modalHistorial = new bootstrap.Modal(document.getElementById('modalHistorial'));
    const modalDetalle = new bootstrap.Modal(document.getElementById('modalDetalle'));

    document.addEventListener('DOMContentLoaded', () => {
        actualizarTop10();
    });

    function guardarDatos() {
        localStorage.setItem('parrillaDataV2', JSON.stringify(datos));
        actualizarTop10();
    }

    // --- FUNCIONES PRINCIPALES ---

    function iniciarNuevaParrillada() {
        idParrilladaEditando = null;
        document.getElementById('form-container').style.display = 'block';
        document.getElementById('titulo-form').innerHTML = '<i class="bi bi-calendar-plus"></i> Nueva Parrillada';
        document.getElementById('modo-edicion-badge').style.display = 'none';
        
        document.getElementById('fechaParrillada').valueAsDate = new Date();
        renderizarListaSeleccion([]); // Lista limpia de checks
        window.scrollTo(0, 200);
    }

    function editarParrillada(id) {
        const asado = datos.asados.find(a => a.id === id);
        if(!asado) return;

        idParrilladaEditando = id;
        document.getElementById('form-container').style.display = 'block';
        document.getElementById('titulo-form').innerHTML = '<i class="bi bi-pencil-square"></i> Editar Parrillada';
        document.getElementById('modo-edicion-badge').style.display = 'inline-block';
        
        document.getElementById('fechaParrillada').value = asado.fecha;
        renderizarListaSeleccion(asado.asistentesIds);
        
        modalHistorial.hide();
        window.scrollTo(0, 200);
    }

    function borrarParrillada(e, id) {
        e.stopPropagation(); // Evita que se dispare el evento de "editar" al hacer click en borrar
        
        if(!confirm("¿Estás seguro que querés eliminar esta parrillada del historial? Se descontarán las asistencias.")) return;

        // Borrar del array
        datos.asados = datos.asados.filter(a => a.id !== id);
        guardarDatos();

        // Si justo estábamos editando la que borramos, cerramos el formulario
        if(idParrilladaEditando === id) {
            cancelarFormulario();
        }

        // Refrescar la lista visual del historial
        abrirHistorialParrilladas();
    }

    function guardarParrillada() {
        const fecha = document.getElementById('fechaParrillada').value;
        if (!fecha) return alert("Falta la fecha");

        const checkboxes = document.querySelectorAll('.checkbox-invitado:checked');
        const asistentesIds = Array.from(checkboxes).map(cb => parseInt(cb.value));

        if (idParrilladaEditando) {
            // Actualizar existente
            const index = datos.asados.findIndex(a => a.id === idParrilladaEditando);
            if(index !== -1) {
                datos.asados[index].fecha = fecha;
                datos.asados[index].asistentesIds = asistentesIds;
            }
        } else {
            // Crear nueva
            datos.asados.push({
                id: Date.now(),
                fecha: fecha,
                asistentesIds: asistentesIds
            });
        }

        guardarDatos();
        cancelarFormulario();
    }

    function cancelarFormulario() {
        document.getElementById('form-container').style.display = 'none';
        idParrilladaEditando = null;
    }

    // --- GESTIÓN DE COMENSALES ---

    function renderizarListaSeleccion(idsSeleccionados = []) {
        const lista = document.getElementById('listaSeleccion');
        lista.innerHTML = '';
        const ordenados = [...datos.comensales].sort((a, b) => a.nombre.localeCompare(b.nombre));

        if(ordenados.length === 0) {
            lista.innerHTML = '<div class="p-3 text-center text-muted">No hay comensales cargados.</div>';
            return;
        }

        ordenados.forEach(p => {
            const isChecked = idsSeleccionados.includes(p.id) ? 'checked' : '';
            const item = document.createElement('div');
            item.className = 'list-group-item d-flex align-items-center gap-2 guest-item search-item';
            item.innerHTML = `
                <input class="form-check-input flex-shrink-0 checkbox-invitado" type="checkbox" value="${p.id}" ${isChecked} style="width: 1.3em; height: 1.3em;">
                <div class="flex-grow-1 ms-2">
                    <span class="fw-bold cursor-pointer guest-name" onclick="verDetalleComensal(${p.id})">${p.nombre} ${p.apellido}</span>
                    <small class="text-muted d-block" style="font-size: 0.8em">${p.vinculo}</small>
                </div>
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-secondary border-0" onclick="prepararEdicionComensal(${p.id})" title="Editar datos"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-outline-danger border-0" onclick="borrarComensal(${p.id})" title="Borrar"><i class="bi bi-trash"></i></button>
                </div>
            `;
            lista.appendChild(item);
        });
    }

    // Crear / Editar Comensal
    function abrirModalNuevoComensal() {
        document.getElementById('tituloModalComensal').innerText = "Nuevo Comensal";
        document.getElementById('idComensalEditando').value = '';
        document.getElementById('inputNombre').value = '';
        document.getElementById('inputApellido').value = '';
        modalComensal.show();
    }

    function prepararEdicionComensal(id) {
        const p = datos.comensales.find(c => c.id === id);
        if(!p) return;
        document.getElementById('tituloModalComensal').innerText = "Editar Comensal";
        document.getElementById('idComensalEditando').value = p.id;
        document.getElementById('inputNombre').value = p.nombre;
        document.getElementById('inputApellido').value = p.apellido;
        document.getElementById('inputVinculo').value = p.vinculo;
        modalComensal.show();
    }

    function guardarComensal() {
        const idEdit = document.getElementById('idComensalEditando').value;
        const nombre = document.getElementById('inputNombre').value.trim();
        const apellido = document.getElementById('inputApellido').value.trim();
        const vinculo = document.getElementById('inputVinculo').value;

        if (!nombre) return;

        if (idEdit) {
            // Editar existente
            const p = datos.comensales.find(c => c.id == idEdit);
            if(p) { p.nombre = nombre; p.apellido = apellido; p.vinculo = vinculo; }
        } else {
            // Nuevo
            const nuevo = { id: Date.now(), nombre, apellido, vinculo };
            datos.comensales.push(nuevo);
        }

        guardarDatos();
        modalComensal.hide();
        
        // Refrescar lista manteniendo selección actual del form
        const currentChecks = Array.from(document.querySelectorAll('.checkbox-invitado:checked')).map(cb => parseInt(cb.value));
        renderizarListaSeleccion(currentChecks);
    }

    function borrarComensal(id) {
        if(!confirm("¿Borrar a esta persona? Se borrará de todas las listas.")) return;
        
        datos.comensales = datos.comensales.filter(c => c.id !== id);
        // Limpiar su ID de los asados pasados para que no quede basura
        datos.asados.forEach(a => {
            a.asistentesIds = a.asistentesIds.filter(aid => aid !== id);
        });
        
        guardarDatos();
        const currentChecks = Array.from(document.querySelectorAll('.checkbox-invitado:checked')).map(cb => parseInt(cb.value));
        renderizarListaSeleccion(currentChecks);
    }

    // --- VISUALIZACIÓN ---

    function filtrarLista() {
        const texto = document.getElementById('buscador').value.toLowerCase();
        document.querySelectorAll('.search-item').forEach(item => {
            item.style.display = item.innerText.toLowerCase().includes(texto) ? 'flex' : 'none';
        });
    }

    function abrirHistorialParrilladas() {
        const lista = document.getElementById('listaHistorialParrilladas');
        lista.innerHTML = '';
        
        // Ordenar por fecha descendente
        const asadosOrdenados = [...datos.asados].sort((a,b) => new Date(b.fecha) - new Date(a.fecha));

        if(asadosOrdenados.length === 0) {
            lista.innerHTML = '<div class="p-3 text-center">No hay parrilladas registradas.</div>';
        } else {
            asadosOrdenados.forEach(a => {
                const [y, m, d] = a.fecha.split('-');
                const item = document.createElement('div');
                item.className = 'list-group-item list-group-item-action d-flex align-items-center p-0';
                // Usamos HTML interno con flex para separar el area clickeable del botón borrar
                item.innerHTML = `
                    <div class="flex-grow-1 p-3 cursor-pointer" onclick="editarParrillada(${a.id})">
                        <div class="fw-bold text-dark">${d}/${m}/${y}</div>
                        <div class="small text-muted">${a.asistentesIds.length} comensales</div>
                    </div>
                    <button class="btn btn-outline-danger border-0 m-2" onclick="borrarParrillada(event, ${a.id})" title="Eliminar registro">
                        <i class="bi bi-trash"></i>
                    </button>
                `;
                lista.appendChild(item);
            });
        }
        modalHistorial.show();
    }

    function verDetalleComensal(id) {
        const persona = datos.comensales.find(c => c.id === id);
        if(!persona) return;

        // Calcular asistencias reales en vivo
        const asadosAsistidos = datos.asados.filter(a => a.asistentesIds.includes(id));
        asadosAsistidos.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));

        document.getElementById('detalleNombre').innerText = `${persona.nombre} ${persona.apellido}`;
        document.getElementById('detalleTotal').innerText = asadosAsistidos.length;
        
        const ul = document.getElementById('detalleFechas');
        ul.innerHTML = '';
        if(asadosAsistidos.length === 0) {
            ul.innerHTML = '<li class="list-group-item text-muted">Aún no participó.</li>';
        } else {
            asadosAsistidos.forEach(a => {
                const [y, m, d] = a.fecha.split('-');
                ul.innerHTML += `<li class="list-group-item"><i class="bi bi-check-circle-fill text-success"></i> ${d}/${m}/${y}</li>`;
            });
        }
        modalDetalle.show();
    }

    function actualizarTop10() {
        const tbody = document.getElementById('tablaTop10');
        document.getElementById('total-parrilladas-badge').innerText = `${datos.asados.length} Eventos`;

        if (datos.comensales.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-muted py-4">Sin datos.</td></tr>';
            return;
        }

        // Calcular conteo dinámico
        const ranking = datos.comensales.map(p => {
            const count = datos.asados.filter(a => a.asistentesIds.includes(p.id)).length;
            return { ...p, count };
        }).sort((a, b) => b.count - a.count).slice(0, 10);

        tbody.innerHTML = '';
        ranking.forEach((p, index) => {
            let icono = `#${index + 1}`;
            if(index === 0) icono = '🥇';
            if(index === 1) icono = '🥈';
            if(index === 2) icono = '🥉';

            tbody.innerHTML += `
                <tr>
                    <td class="fw-bold">${icono}</td>
                    <td class="text-start cursor-pointer text-primary" onclick="verDetalleComensal(${p.id})">${p.nombre} ${p.apellido}</td>
                    <td><span class="badge bg-light text-dark border">${p.vinculo}</span></td>
                    <td class="fw-bold">${p.count}</td>
                </tr>
            `;
        });
    }
</script>
</body>
</html>
