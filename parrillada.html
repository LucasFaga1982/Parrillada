<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parrilla Tracker 🔥</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #d35400; /* Color brasa */
            --secondary-color: #2c3e50;
            --bg-color: #f8f9fa;
        }
        body { background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-brand { background-color: var(--primary-color); color: white; padding: 20px; border-radius: 0 0 15px 15px; margin-bottom: 30px; }
        .card { border: none; shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 12px; margin-bottom: 20px; }
        .btn-fire { background-color: var(--primary-color); color: white; border: none; }
        .btn-fire:hover { background-color: #a04000; color: white; }
        .guest-item { cursor: pointer; transition: 0.2s; }
        .guest-item:hover { background-color: #f1f1f1; }
        .badge-visits { font-size: 0.9em; background-color: var(--secondary-color); }
        .table-responsive { border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body>

<div class="container pb-5">
    
    <div class="header-brand text-center shadow">
        <h1><i class="bi bi-fire"></i> Mi Parrilla Tracker</h1>
        <p class="mb-0">Historial de Asados y Comensales</p>
    </div>

    <div class="row">
        <div class="col-md-5 mb-4">
            
            <div class="d-grid gap-2 mb-4">
                <button onclick="mostrarFormularioParrillada()" class="btn btn-fire btn-lg shadow">
                    <i class="bi bi-plus-circle-dotted"></i> Registrar Nueva Parrillada
                </button>
            </div>

            <div id="form-container" class="card shadow p-3" style="display: none;">
                <h4 class="mb-3 text-secondary"><i class="bi bi-calendar-event"></i> Nuevo Asado</h4>
                
                <div class="mb-3">
                    <label class="form-label">Fecha del Asado</label>
                    <input type="date" id="fechaAsado" class="form-control" value="">
                </div>

                <hr>

                <h5 class="mb-2">¿Quiénes vinieron?</h5>
                <p class="text-muted small">Selecciona de la lista o agrega uno nuevo.</p>

                <input type="text" id="buscador" class="form-control mb-2 form-control-sm" placeholder="Buscar nombre..." onkeyup="filtrarLista()">

                <div class="list-group mb-3 overflow-auto border" style="max-height: 250px;" id="listaSeleccion">
                    </div>

                <button class="btn btn-outline-secondary w-100 mb-3 btn-sm" data-bs-toggle="modal" data-bs-target="#modalNuevoComensal">
                    <i class="bi bi-person-plus"></i> Agregar Nuevo Comensal (que no esté en lista)
                </button>

                <div class="d-grid">
                    <button onclick="guardarParrillada()" class="btn btn-success">
                        <i class="bi bi-save"></i> Guardar Parrillada
                    </button>
                    <button onclick="cancelarFormulario()" class="btn btn-link text-danger mt-1">Cancelar</button>
                </div>
            </div>

        </div>

        <div class="col-md-7">
            
            <div class="card shadow">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-trophy-fill text-warning"></i> Top 10 Asistencia Perfecta</h5>
                    <span class="badge bg-warning text-dark" id="total-asados-badge">0 Asados Totales</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0 align-middle text-center">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Nombre</th>
                                    <th>Vínculo</th>
                                    <th>Asistencias</th>
                                    <th>% Asistencia</th>
                                </tr>
                            </thead>
                            <tbody id="tablaTop10">
                                <tr><td colspan="5" class="text-muted py-4">Aún no hay datos registrados.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card shadow mt-3 bg-light">
                <div class="card-body">
                    <small class="text-muted">Último asado registrado:</small>
                    <strong id="ultimo-asado-fecha" class="d-block fs-5 text-dark">-</strong>
                </div>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="modalNuevoComensal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nuevo Comensal</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formNuevoComensal">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="nuevoNombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" id="nuevoApellido" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Vínculo</label>
                        <select id="nuevoVinculo" class="form-select">
                            <option value="Amigo/a">Amigo/a</option>
                            <option value="Familiar">Familiar</option>
                            <option value="Compañero/a">Compañero/a</option>
                            <option value="Vecino/a">Vecino/a</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-primary" onclick="agregarComensal()">Crear y Seleccionar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- LÓGICA DE LA APP ---

    // Estructura de datos inicial
    let datos = JSON.parse(localStorage.getItem('parrillaData')) || {
        comensales: [], // { id, nombre, apellido, vinculo, asistencias }
        asados: []      // { id, fecha, asistentesIds[] }
    };

    // Inicializar app
    document.addEventListener('DOMContentLoaded', () => {
        actualizarTop10();
        setFechaHoy();
    });

    function setFechaHoy() {
        document.getElementById('fechaAsado').valueAsDate = new Date();
    }

    // Guardar en LocalStorage
    function guardarDatos() {
        localStorage.setItem('parrillaData', JSON.stringify(datos));
        actualizarTop10();
    }

    // 1. Mostrar/Ocultar Formulario
    function mostrarFormularioParrillada() {
        document.getElementById('form-container').style.display = 'block';
        renderizarListaSeleccion();
        window.scrollTo(0, 200);
    }

    function cancelarFormulario() {
        document.getElementById('form-container').style.display = 'none';
    }

    // 2. Renderizar lista de comensales existentes (Checklist)
    function renderizarListaSeleccion() {
        const lista = document.getElementById('listaSeleccion');
        lista.innerHTML = '';

        // Ordenar alfabéticamente
        const ordenados = [...datos.comensales].sort((a, b) => a.nombre.localeCompare(b.nombre));

        if(ordenados.length === 0) {
            lista.innerHTML = '<div class="list-group-item text-center text-muted">Aún no hay comensales registrados. ¡Agrega uno nuevo!</div>';
            return;
        }

        ordenados.forEach(p => {
            const item = document.createElement('label');
            item.className = 'list-group-item d-flex gap-3 search-item';
            item.innerHTML = `
                <input class="form-check-input flex-shrink-0 checkbox-invitado" type="checkbox" value="${p.id}" style="font-size: 1.3em;">
                <span class="pt-1 form-check-label w-100 d-flex justify-content-between align-items-center">
                    <strong>${p.nombre} ${p.apellido}</strong>
                    <small class="badge bg-light text-dark border">${p.vinculo}</small>
                </span>
            `;
            lista.appendChild(item);
        });
    }

    // Filtro de búsqueda en la lista
    function filtrarLista() {
        const texto = document.getElementById('buscador').value.toLowerCase();
        const items = document.querySelectorAll('.search-item');
        items.forEach(item => {
            const nombre = item.innerText.toLowerCase();
            item.style.display = nombre.includes(texto) ? 'flex' : 'none';
        });
    }

    // 3. Agregar Nuevo Comensal desde el Modal
    function agregarComensal() {
        const nombre = document.getElementById('nuevoNombre').value.trim();
        const apellido = document.getElementById('nuevoApellido').value.trim();
        const vinculo = document.getElementById('nuevoVinculo').value;

        if (!nombre || !apellido) return alert("Nombre y apellido son obligatorios");

        const nuevoId = Date.now(); // ID simple basado en tiempo
        const nuevoPersona = {
            id: nuevoId,
            nombre: nombre,
            apellido: apellido,
            vinculo: vinculo,
            asistencias: 0
        };

        datos.comensales.push(nuevoPersona);
        guardarDatos(); // Guardamos el nuevo usuario base

        // Cerrar modal
        const modalEl = document.getElementById('modalNuevoComensal');
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        modalInstance.hide();

        // Limpiar inputs
        document.getElementById('nuevoNombre').value = '';
        document.getElementById('nuevoApellido').value = '';

        // Renderizar de nuevo y seleccionar automáticamente al nuevo
        renderizarListaSeleccion();
        
        // Truco para dejar seleccionado al que acabamos de crear:
        setTimeout(() => {
            const checkboxes = document.querySelectorAll('.checkbox-invitado');
            checkboxes.forEach(chk => {
                if(parseInt(chk.value) === nuevoId) chk.checked = true;
            });
        }, 100);
    }

    // 4. Guardar la Parrillada (Procesar datos)
    function guardarParrillada() {
        const fecha = document.getElementById('fechaAsado').value;
        if (!fecha) return alert("Ingresa una fecha");

        // Obtener seleccionados
        const checkboxes = document.querySelectorAll('.checkbox-invitado:checked');
        if (checkboxes.length === 0) {
            if(!confirm("¿Estás seguro de registrar una parrillada sin invitados?")) return;
        }

        const asistentesIds = Array.from(checkboxes).map(cb => parseInt(cb.value));

        // Actualizar contadores de asistencias
        datos.comensales.forEach(p => {
            if (asistentesIds.includes(p.id)) {
                p.asistencias++;
            }
        });

        // Guardar evento
        datos.asados.push({
            id: Date.now(),
            fecha: fecha,
            asistentesIds: asistentesIds
        });

        guardarDatos();
        cancelarFormulario();
        alert("¡Parrillada registrada con éxito!");
    }

    // 5. Actualizar Tabla Top 10
    function actualizarTop10() {
        const tbody = document.getElementById('tablaTop10');
        const totalAsados = datos.asados.length;
        
        document.getElementById('total-asados-badge').innerText = `${totalAsados} Asados Totales`;
        
        // Actualizar último asado
        if(totalAsados > 0) {
            const ultimo = datos.asados[datos.asados.length - 1];
            // Formato de fecha local
            const [y, m, d] = ultimo.fecha.split('-');
            document.getElementById('ultimo-asado-fecha').innerText = `${d}/${m}/${y}`;
        }

        if (datos.comensales.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-muted py-4">Sin datos aún.</td></tr>';
            return;
        }

        // Ordenar por asistencias (descendente) y tomar 10
        const top10 = [...datos.comensales]
            .sort((a, b) => b.asistencias - a.asistencias)
            .slice(0, 10);

        tbody.innerHTML = '';
        top10.forEach((p, index) => {
            // Calcular porcentaje
            let porcentaje = totalAsados > 0 ? Math.round((p.asistencias / totalAsados) * 100) : 0;
            
            // Icono de medalla para los top 3
            let icono = '';
            if(index === 0) icono = '🥇';
            else if(index === 1) icono = '🥈';
            else if(index === 2) icono = '🥉';
            else icono = `#${index + 1}`;

            const row = `
                <tr>
                    <td class="fw-bold">${icono}</td>
                    <td>${p.nombre} ${p.apellido}</td>
                    <td><span class="badge bg-secondary">${p.vinculo}</span></td>
                    <td class="fw-bold fs-5">${p.asistencias}</td>
                    <td>
                        <div class="progress" style="height: 5px;">
                            <div class="progress-bar bg-warning" role="progressbar" style="width: ${porcentaje}%"></div>
                        </div>
                        <small class="text-muted" style="font-size:0.7rem">${porcentaje}%</small>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

</script>
</body>
</html>
